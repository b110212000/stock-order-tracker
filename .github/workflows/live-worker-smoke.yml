name: Live Worker API - Safe Email Readiness
on:
  pull_request:
    paths:
      - backend/scripts/verify_live_worker.py
      - .github/workflows/live-worker-smoke.yml
  push:
    branches: [main]
    paths:
      - backend/scripts/verify_live_worker.py
      - .github/workflows/live-worker-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-email-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check production Email auth gate (no email, passwords or financial data)
        run: python3 backend/scripts/verify_live_worker.py
