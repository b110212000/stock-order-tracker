name: CI - Typecheck and Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate additive Email D1 migration without secrets
        run: python3 backend/scripts/check_email_migration.py
      - name: Validate D1 readonly API parser with fake data only
        run: python3 backend/scripts/audit_production_d1.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run backend:typecheck
      - name: Validate Worker bundle without Cloudflare credentials
        run: |
          cd backend
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .wrangler-preview
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
