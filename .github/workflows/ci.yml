name: CI - Typecheck and Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run backend:typecheck
      - name: Install Wrangler for local D1 migration tests
        run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Validate D1 migrations in a local Wrangler database
        working-directory: backend
        run: |
          sed 's/REPLACE_WITH_YOUR_D1_DATABASE_ID/11111111-1111-4111-8111-111111111111/' wrangler.example.jsonc > wrangler.jsonc
          npx wrangler d1 migrations apply DB --local
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
